[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "jiuwen-model-router"
version = "0.1.0"
description = "openjiuwen-router Python 门面（PyO3 / maturin）"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
# Needed to classify with a model. Without it, x-router runs only in heuristic
# mode, which must be chosen explicitly with `enabled = false`: omitting the
# [x-router.classifier_model] section is an error, not a fallback.
x-router = ["torch>=2.0", "transformers>=5.0"]
# The bandit's state (BanditStore) vectorises with numpy. Only needed when a
# profile has an [x-router.bandit.store] table; the bandit's decision half is
# pure Python and reads whatever state the profile names.
x-router-bandit = ["numpy>=1.24"]

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
python-source = "python"
module-name = "openjiuwen._openjiuwen"
features = ["extension-module"]
include = [{ path = "LICENSE", format = ["sdist", "wheel"] }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.pyright]
include = ["python", "tests"]
extraPaths = ["python"]
stubPath = "typings"
pythonVersion = "3.8"
reportMissingModuleSource = false
